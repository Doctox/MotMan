name: Monitor player reports

# Les signalements de joueurs n'étaient notifiés nulle part : ils s'accumulaient
# dans `public.reports` sans que personne ne le sache. Ce workflow réutilise le
# canal d'alerte déjà en place (issue GitHub) et le même secret que la
# surveillance Edge. Aucun service tiers, aucune adresse e-mail à configurer.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-player-reports
  cancel-in-progress: true

jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitoring code
        uses: actions/checkout@v4

      - name: Query pending player reports
        id: reports
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/check_pending_reports.mjs

      - name: Open or update the monitoring failure
        if: steps.reports.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[MotMan] Surveillance des signalements indisponible'
            const label = 'monitoring:reports'
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'D93F0B', description: 'Signalements de joueurs à traiter' })
            }
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 })
            const existing = issues.find(issue => issue.title === title)
            const body = [
              'La surveillance des signalements n’a pas pu interroger la base.',
              '',
              `Exécution : ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'Causes probables : secret absent ou expiré, ou API Supabase indisponible.',
              '',
              '⚠️ Tant que cette alerte est ouverte, **les signalements de joueurs ne sont plus surveillés**.',
            ].join('\n')
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] })
            }

      - name: Open or update the report alert
        if: steps.reports.outcome == 'success' && steps.reports.outputs.has_pending == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('output/monitoring/player-reports.json', 'utf8'))
            const owner = context.repo.owner
            const repo = context.repo.repo
            const title = '[MotMan] Signalements de joueurs à traiter'
            const label = 'monitoring:reports'
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label })
            } catch (error) {
              if (error.status !== 404) throw error
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'D93F0B', description: 'Signalements de joueurs à traiter' })
            }
            const reasons = Object.entries(report.byReason)
              .sort((a, b) => b[1] - a[1])
              .map(([reason, count]) => `| \`${reason}\` | ${count} |`)
            const body = [
              `<!-- reports-signature:${report.signature} -->`,
              `**${report.pending} signalement(s) non traité(s)**, dont ${report.last24h} sur les dernières 24 h.`,
              report.oldestAgeHours >= 48
                ? `\n⚠️ Le plus ancien attend depuis **${report.oldestAgeHours} h**.`
                : `\nLe plus ancien attend depuis ${report.oldestAgeHours} h.`,
              '',
              '| Motif | Nombre |',
              '| --- | --- |',
              ...reasons,
              '',
              '### Pour les traiter',
              '',
              'Le détail rédigé par les joueurs n’est **volontairement pas repris ici** : il reste en base.',
              'Ouvrez la table `public.reports` dans Supabase, lisez les lignes dont `reviewed_at` est vide,',
              'puis renseignez `status`, `reviewed_at` et `reviewed_by` — cette alerte se fermera d’elle-même.',
              '',
              `_Relevé du ${report.generatedAt}._`,
            ].join('\n')
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 })
            const existing = issues.find(issue => issue.title === title)
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] })
            }

      - name: Close the alert once every report is handled
        if: steps.reports.outcome == 'success' && steps.reports.outputs.has_pending != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const label = 'monitoring:reports'
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 })
            for (const issue of issues) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'Tous les signalements ont été traités. Fermeture automatique.' })
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' })
            }
